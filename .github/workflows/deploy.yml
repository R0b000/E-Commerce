name: CI/CD Deploy to Server

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend Client (Vite SPA)
        run: pnpm build

      - name: Package Application for Server
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp -r Shared deploy/
          cp -r auth.server deploy/
          cp -r ecommerce.server deploy/
          cp index.js deploy/
          cp package.json deploy/
          cp pnpm-lock.yaml deploy/
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

      - name: Generate Production .env File
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PORT: ${{ secrets.PORT }}
        run: |
          if [ -n "$APP_ENV" ]; then
            echo "$APP_ENV" > deploy/.env
          else
            cat << EOF > deploy/.env
          NODE_ENV=production
          PORT=${PORT:-30160}
          MONGO_URI=${MONGO_URI}
          JWT_SECRET=${JWT_SECRET:-himalaya_secret_key_change_me}
          JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
          CLIENT_URL=${CLIENT_URL:-https://himalayaonlineshop.engicheck.com}
          CLOUDINARY_URL=${CLOUDINARY_URL}
          REDIS_URL=${REDIS_URL}
          EOF
          fi

      - name: Deploy to Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.CPANEL_SERVER_PATH || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

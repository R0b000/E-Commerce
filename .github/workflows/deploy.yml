name: CI/CD HTTPS Auto-Deploy

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tools
        run: |
          npm install -g pnpm@9 esbuild

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Project (Compile Vite SPA)
        run: pnpm build

      - name: Bundle Server & Built Assets into Single Clean Distribution
        run: |
          mkdir -p deploy
          
          # Copy compiled client build (both as /dist and at root for direct web serving)
          cp -r dist deploy/
          cp -r dist/* deploy/
          
          # Bundle backend into a single lean file (no raw source folders)
          esbuild index.js \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=cjs \
            --outfile=deploy/index.js \
            --external:express \
            --external:mongoose \
            --external:ioredis \
            --external:socket.io \
            --external:bcryptjs \
            --external:jsonwebtoken \
            --external:helmet \
            --external:cors \
            --external:morgan \
            --external:express-rate-limit \
            --external:dotenv
          
          cp package.json deploy/
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

      - name: Securely Generate Production .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PORT: ${{ secrets.PORT }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          node -e '
            const fs = require("fs");
            if (process.env.APP_ENV && process.env.APP_ENV.trim()) {
              fs.writeFileSync("deploy/.env", process.env.APP_ENV.trim() + "\n");
            } else {
              const lines = [
                `NODE_ENV=${process.env.NODE_ENV || "production"}`,
                `PORT=${process.env.PORT || "30160"}`,
                `CLIENT_URL=${process.env.CLIENT_URL || "https://himalayaonlineshop.engicheck.com"}`,
                `CLOUDINARY_URL=${process.env.CLOUDINARY_URL || ""}`,
                `JWT_EXPIRES_IN=${process.env.JWT_EXPIRES_IN || "24h"}`,
                `JWT_SECRET=${process.env.JWT_SECRET || ""}`,
                `MONGO_URI=${process.env.MONGO_URI || ""}`,
                `REDIS_URL=${process.env.REDIS_URL || "redis://localhost:6379"}`
              ];
              fs.writeFileSync("deploy/.env", lines.join("\n") + "\n");
            }
          '

      - name: Compress Build Bundle
        run: |
          cd deploy
          zip -r ../deploy.zip .
          cd ..

      - name: Deploy to Server via HTTPS (Binary Stream)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN || 'my_super_secret_deploy_token_123' }}
        run: |
          echo "Uploading deploy.zip to https://himalayaonlineshop.engicheck.com/deploy.php ..."
          RESPONSE=$(curl --http1.1 -k -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@deploy.zip" \
            "https://himalayaonlineshop.engicheck.com/deploy.php?token=${DEPLOY_TOKEN}")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Server Response: $BODY"
          echo "HTTP Status: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed with HTTP $STATUS"
            exit 1
          fi
          
          echo "✅ Deployment Successful!"

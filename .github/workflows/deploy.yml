name: CI/CD HTTPS Auto-Deploy

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tools
        run: |
          npm install -g pnpm@9 esbuild

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Project (Compile Vite SPA)
        run: pnpm build

      - name: Bundle Server (100% Standalone - Zero node_modules needed on server)
        run: |
          mkdir -p deploy
          
          # Copy compiled client build (dist folder and its root contents)
          cp -r dist deploy/
          cp -r dist/* deploy/
          
          # Bundle backend + all dependencies into a single 100% standalone executable
          esbuild index.js \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=cjs \
            --outfile=deploy/index.js
          
          cp package.json deploy/
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt
          
          # Create reverse-proxy .htaccess so Apache / LiteSpeed routes /api to Node.js port 30160
          cat << 'EOF' > deploy/.htaccess
          <IfModule mod_rewrite.c>
          RewriteEngine On

          # Prevent LiteSpeed timeouts
          <IfModule Litespeed>
          RewriteRule .* - [E=noabort:1,E=noconntimeout:1]
          </IfModule>

          # Proxy API and Health endpoints to Node.js backend
          RewriteRule ^api/(.*)$ http://127.0.0.1:30160/api/$1 [P,L]
          RewriteRule ^health$ http://127.0.0.1:30160/health [P,L]

          # Proxy Socket.io WebSockets
          RewriteCond %{HTTP:Upgrade} websocket [NC]
          RewriteCond %{HTTP:Connection} upgrade [NC]
          RewriteRule ^socket.io/(.*)$ ws://127.0.0.1:30160/socket.io/$1 [P,L]
          RewriteRule ^socket.io/(.*)$ http://127.0.0.1:30160/socket.io/$1 [P,L]

          # React SPA Frontend Fallback Routing
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Securely Generate Production .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PORT: ${{ secrets.PORT }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          node -e '
            const fs = require("fs");
            if (process.env.APP_ENV && process.env.APP_ENV.trim()) {
              fs.writeFileSync("deploy/.env", process.env.APP_ENV.trim() + "\n");
            } else {
              const lines = [
                `NODE_ENV=${process.env.NODE_ENV || "production"}`,
                `PORT=${process.env.PORT || "30160"}`,
                `CLIENT_URL=${process.env.CLIENT_URL || "https://himalayaonlineshop.engicheck.com"}`,
                `CLOUDINARY_URL=${process.env.CLOUDINARY_URL || ""}`,
                `JWT_EXPIRES_IN=${process.env.JWT_EXPIRES_IN || "24h"}`,
                `JWT_SECRET=${process.env.JWT_SECRET || ""}`,
                `MONGO_URI=${process.env.MONGO_URI || ""}`,
                `REDIS_URL=${process.env.REDIS_URL || "redis://localhost:6379"}`
              ];
              fs.writeFileSync("deploy/.env", lines.join("\n") + "\n");
            }
          '

      - name: Compress Build Bundle
        run: |
          cd deploy
          zip -9 -q -r ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      - name: Deploy to Server via HTTPS
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN || 'my_super_secret_deploy_token_123' }}
        run: |
          TARGET_URL="https://himalayaonlineshop.engicheck.com/deploy.php"
          echo "Attempting upload to: $TARGET_URL ..."
          
          RESPONSE=$(curl --http1.1 -k -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -F "bundle=@deploy.zip" \
            "${TARGET_URL}?token=${DEPLOY_TOKEN}")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          if [ "$STATUS" -ne 200 ]; then
            echo "Primary endpoint returned $STATUS. Trying fallback: https://engicheck.com/himalayaonlineshop/deploy.php ..."
            TARGET_URL="https://engicheck.com/himalayaonlineshop/deploy.php"
            RESPONSE=$(curl --http1.1 -k -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -F "bundle=@deploy.zip" \
              "${TARGET_URL}?token=${DEPLOY_TOKEN}")
            
            BODY=$(echo "$RESPONSE" | sed -e '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          fi
          
          echo "Server Response: $BODY"
          echo "Final HTTP Status: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed with HTTP $STATUS"
            exit 1
          fi
          
          echo "✅ Deployment Successful!"
